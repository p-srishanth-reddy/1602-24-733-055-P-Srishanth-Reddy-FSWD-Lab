<!DOCTYPE html>
<html>
<head>
    <title>Study Information</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="personal.html">Personal Information</a>
        <a href="study.html">Study Information</a>
    </nav>

    <div class="container">
        <h1>Educational Qualifications</h1>

        <form>
            <label for="college">College Name:</label>
            <input type="text" id="college" name="college" required>

            <label for="cgpa">CGPA:</label>
            <input 
                type="number" 
                id="cgpa" 
                name="cgpa" 
                min="0" 
                max="10" 
                step="0.1" 
                required
            >

            <label for="branch">Branch Name:</label>
            <select id="branch" name="branch" required>
                <option value="">-- Select Branch --</option>
                <option value="cse">Computer Science and Engineering</option>
                <option value="ece">Electronics and Communication Engineering</option>
                <option value="eee">Electrical and Electronics Engineering</option>
                <option value="mech">Mechanical Engineering</option>
                <option value="civil">Civil Engineering</option>
                <option value="it">Information Technology</option>
            </select>

            <label for="subject">Favourite Subject:</label>
            <input type="text" id="subject" name="subject" required>

            <label for="gpa">10th GPA:</label>
            <input 
                type="number" 
                id="gpa" 
                name="gpa" 
                min="0" 
                max="10" 
                step="0.1" 
                required
            >

            <label for="rating">Rating About College:</label>
            <input 
                type="range" 
                id="rating" 
                name="rating" 
                min="0" 
                max="10" 
                value="5"
                step="1"
            >

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
